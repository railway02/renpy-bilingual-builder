name: Windows portable

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable:
    runs-on: windows-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
      - name: Package Windows folder and ZIP
        run: python tools/package_windows.py
      - name: Run relocated EXE without Python on PATH
        run: python tools/smoke_windows_bundle.py dist/RenPy-Bilingual-Builder-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: RenPy-Bilingual-Builder-windows-x64
          path: |
            dist/RenPy-Bilingual-Builder-windows-x64.zip
            dist/RenPy-Bilingual-Builder-windows-x64.zip.sha256
          if-no-files-found: error
