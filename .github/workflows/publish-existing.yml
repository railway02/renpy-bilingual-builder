name: Publish existing Windows package

on:
  create:

permissions:
  contents: write

jobs:
  publish:
    if: github.event.ref_type == 'branch' && github.event.ref == 'publish-existing/v0.2.0'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.ref }}
      - name: Publish the already-built package
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/RenPy-Bilingual-Builder-windows-x64.zip"
          cat .release/parts/part-*.bin > "$package"
          gh release create v0.2.0 --draft --target "$(cat .release/target.txt)" --title "RenPy双语工具 v0.2.0" --notes-file .release/notes.md
          gh release upload v0.2.0 "$package"
          gh release edit v0.2.0 --draft=false --latest
